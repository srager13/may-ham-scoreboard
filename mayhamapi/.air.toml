root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

# Loads .env.development and then .env files.
# Values in the lattermost file overwrite any preceding ones.
# Does not overwrite variables that were present before running air.
env_files = [".env.development"]

[build]
  args_bin = []
  # Build output is placed outside the repo to avoid polluting the workspace
  # and interfering with go modules. Use an absolute path in /tmp which is
  # prepared by the systemd unit for the dev service.
  entrypoint = "/tmp/golftournament-dev/main"
  cmd = "go build -buildvcs=false -o /tmp/golftournament-dev/main ."
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "frontend", "static", "system-service", "nginx-proxy-config"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_root = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
