# systemd-tmpfiles configuration for golf-api directories
# Creates persistent upload directories for production and development services
# Format: Type Path Mode UID GID Age

# Production
d /srv/golf-api 0755 root root -
d /srv/golf-api/uploads 0755 golftournament golftournament -

# Development
d /srv/golf-api-dev 0755 root root -
d /srv/golf-api-dev/uploads 0755 golftournament-dev golftournament-dev -
